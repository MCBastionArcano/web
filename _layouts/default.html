<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} - {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tipografía medieval -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Merriweather&display=swap" rel="stylesheet">

  <!-- Estilos principales -->
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">

  <!-- SEO automático -->
  {% seo %}
</head>
<body>
  <!-- Encabezado con logo y título -->
  <header>
    <a href="{{ '/' | relative_url }}" style="text-decoration:none; color:inherit;">
      <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="Logo Bastión Arcano" class="logo">
      <h1>⚜ Bastión Arcano ⚜</h1>
      <p>Donde la magia y el acero se encuentran</p>
    </a>
  </header>

  <!-- Sección independiente para la barra de navegación -->
  <section class="navbar-section">
    {% include nav.html %}
  </section>

  <!-- Contenido principal -->
  <main>
    {{ content }}
  </main>

  <!-- Pie de página -->
  <footer>
    © 2026 Bastión Arcano — Comunidad Minecraft<br>
    <a href="https://discord.gg/pgz7ZS3nMy">Discord</a> |
    <a href="{{ '/reglas.md' | relative_url }}">Reglas</a> |
    <a href="{{ '/' | relative_url }}">Inicio</a>
  </footer>
</body>
</html>
